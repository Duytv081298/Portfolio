  <line x1="0" y1="188" x2="460" y2="188" stroke="#21262d" stroke-width="0.5"/>

  <!-- Row 6: Firebase Proficient -->
  <text x="0" y="212" font-family="'Segoe UI',sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3">Database &amp; Services (Firebase)</text>
  <rect x="240" y="201" width="150" height="12" rx="6" fill="#21262d"/>
  <rect x="240" y="201" width="75" height="12" rx="6" fill="#F97316"/>
  <text x="460" y="212" font-family="'Segoe UI',sans-serif" font-size="11.5" fill="#F97316" text-anchor="end" font-weight="700">Proficient</text>
